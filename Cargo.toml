[package]
name = "dupdelta"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Delta-aware multi-language near-duplicate code detection: reports only the duplication a change introduces."
license = "MIT"
repository = "https://github.com/elecnix/dupdelta"
readme = "README.md"
keywords = ["duplication", "clone-detection", "tree-sitter", "static-analysis", "ci"]
categories = ["development-tools", "development-tools::testing"]

[lib]
name = "dupdelta"
path = "src/lib.rs"

[[bin]]
name = "dupdelta"
path = "src/main.rs"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
