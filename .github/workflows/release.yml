name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # No x86_64-apple-darwin. It needs the `macos-13` image, which GitHub
          # has retired -- a job targeting it sat queued for 23 minutes and was
          # never scheduled, holding up a release whose other two targets had
          # already built. Since `publish` needs every build, one dead runner
          # blocks the whole release indefinitely.
          #
          # Nothing consumes that artifact: the action downloads the Linux
          # binary, and current Macs are Apple Silicon. Intel Mac users can
          # `cargo install --git https://github.com/elecnix/dupdelta`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (v1)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The published binary is what users actually run, so prove it works
      # before shipping it, rather than trusting that a green test job on a
      # different profile implies a working artifact.
      - name: Smoke-test the artifact
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/dupdelta"
          "$BIN" --version
          "$BIN" languages | grep -q python

      - name: Package
        run: |
          set -euo pipefail
          # No version in the asset name, deliberately: it lets the action
          # fall back to `releases/latest/download/<asset>` when a consumer
          # pins a moving alias like `@v1`, which is not itself a release.
          # Each release scopes its own assets, so the names cannot collide.
          NAME="dupdelta-${{ matrix.target }}"
          tar -czf "${NAME}.tar.gz" -C "target/${{ matrix.target }}/release" dupdelta
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
